[build-system]
requires = [
  "scikit-build-core>=0.10,<1",
  "pybind11>=2.13,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "cpp-gym-nav"
version = "0.1.0"
description = "A deterministic C++ robot-navigation simulator exposed as a Gymnasium environment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Karim Amer" }]
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
train = [
  "stable-baselines3>=2.4,<3",
  "tensorboard>=2.16,<3",
  "matplotlib>=3.8,<4",
  "imageio>=2.34,<3",
]
test = [
  "pytest>=8,<10",
  "stable-baselines3>=2.4,<3",
  "pybind11>=2.13,<4",
]
dev = [
  "stable-baselines3>=2.4,<3",
  "tensorboard>=2.16,<3",
  "matplotlib>=3.8,<4",
  "imageio>=2.34,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pybind11>=2.13,<4",
]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["python/cpp_gym_nav"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
